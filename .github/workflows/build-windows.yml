name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construire l'exécutable
        run: pyinstaller --onefile --name ClimatInterieur app.py

      - name: Ajouter le modèle .env
        run: copy .env.example dist\.env

      - uses: actions/upload-artifact@v4
        with:
          name: ClimatInterieur-windows
          path: dist/
